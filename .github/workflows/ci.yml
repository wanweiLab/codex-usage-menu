name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        macos: [macos-14, macos-15]
    runs-on: ${{ matrix.macos }}
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Verify app bundle
        run: codesign --verify --deep --strict "build/Codex Pulse.app"
